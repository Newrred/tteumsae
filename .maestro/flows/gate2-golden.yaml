appId: com.tteumsae.app
name: Gate 2 one-stop golden journey
tags:
  - gate2
---
- launchApp
- runFlow:
    label: Close the daily guide when it is visible
    when:
      visible: "강원도로 가는 길, 어디 들를까?"
    commands:
      - tapOn: "확인"
- runFlow:
    label: Leave place detail when it is open
    when:
      visible: "카카오맵에서 경유지로 안내"
    commands:
      - back
- runFlow:
    label: Leave recommendation results when they are open
    when:
      visible: "한 곳만 골라 가볍게 들러보세요"
    commands:
      - back
- runFlow:
    label: Reset an existing route input from home
    when:
      visible: "어디로, 몇 시까지 가나요?"
    commands:
      - back
- runFlow:
    label: Open route input from home when needed
    when:
      visible: "목적지 검색"
    commands:
      - tapOn: "목적지 검색"
- hideKeyboard
- assertVisible: "어디로, 몇 시까지 가나요?"
- runScript: ../scripts/deadline.js
- tapOn: "목적지 장소 검색"
- inputText: "강릉역"
- hideKeyboard
- extendedWaitUntil:
    visible: "강릉역"
    timeout: 15000
- takeScreenshot:
    path: destination-search
    label: Capture destination search results
- tapOn:
    text: "^강릉역$"
    index: 1
- assertVisible: "강릉역"
- tapOn: "도착해야 하는 시각 선택"
- assertVisible: "도착 마감 선택"
- takeScreenshot:
    path: deadline-picker
    label: Capture the arrival deadline picker
- tapOn: ${output.deadline.meridiem}
- tapOn: ${output.deadline.hourSelector}
- takeScreenshot:
    path: deadline-minute-picker
    label: Capture the arrival deadline minute picker
- tapOn: ${output.deadline.minuteSelector}
- tapOn: "확인"
- assertVisible: ${output.deadline.visibleLabel}
- scrollUntilVisible:
    element: "틈새 찾기"
    direction: DOWN
- tapOn: "틈새 찾기"
- extendedWaitUntil:
    visible: "한 곳만 골라 가볍게 들러보세요"
    timeout: 60000
- assertVisible: "핀에는 추가 이동시간만 표시해요"
- assertVisible: "목적지로 바로 안내"
- takeScreenshot:
    path: recommendations
    label: Capture recommendation results before selection
- tapOn:
    text: "^선택$"
    index: 0
- assertVisible: "선택됨"
- assertVisible: "이동 기준 최대 약 [0-9]+분"
- assertVisible: ".*까지 출발하면 돼요"
- assertVisible: "출발 5분 전에 알려드릴까요?"
- assertVisible: "이곳 들러 카카오맵 안내"
- takeScreenshot:
    path: selected-recommendation
    label: Capture a selected one-stop recommendation
